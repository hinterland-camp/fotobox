appId: camp.hinterland.fotobox
productName: Fotobox
directories:
  output: release
files:
  - out/**/*
  - package.json
  # electron-updater stays external so it can resolve at runtime;
  # electron-builder prunes this to production dependencies.
  - node_modules/**/*
  - "!**/*.map"
publish:
  provider: github
  owner: hinterland-camp
  repo: fotobox
  # Draft releases are not downloadable, so the updater would never see them
  releaseType: release
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: true
  createDesktopShortcut: true
  runAfterFinish: true
