# Deployment for the Fotobox web app (upload API + branded download pages).
# Point Coolify at this file; it builds from the repo root so the web app can
# reach its @fotobox/shared workspace dependency.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Coolify injects its own domain/proxy config; these stay fixed.
      NODE_ENV: production
      NITRO_PORT: 3000
      NITRO_HOST: 0.0.0.0
      # Shared secret the booth must send to upload. Set this in Coolify.
      # Left empty the deploy still succeeds, but every upload is refused with
      # a 503 until it is set — the server fails closed either way.
      NUXT_UPLOAD_TOKEN: ${NUXT_UPLOAD_TOKEN:-}
    ports:
      - "3000:3000"
    volumes:
      # Uploaded photos — losing this loses every guest's download link
      - fotobox-uploads:/app/uploads
      # SQLite database holding photo metadata
      - fotobox-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  fotobox-uploads:
  fotobox-data:
